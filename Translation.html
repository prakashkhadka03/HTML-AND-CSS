<!doctype html>
<html>
  <head>
    <title>Transaction Page</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: rgb(43, 170, 229);
        transition: 
          width 2s,
          height 2s,
          background-color 2s,
          transform 2s;
        text-align: center;
      }
      div:hover {
        width: 300px;
        height: 200px;
        background-color: rgb(208, 110, 18);
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div id="div1">linear</div>
    <br />
    <div id="div2">ease</div>
    <br />
    <div id="div3">ease-in</div>
    <br />
    <div id="div4">ease-out</div>
    <br />
    <div id="div5">ease-in-out</div>
    <br />
  </body>
</html>
