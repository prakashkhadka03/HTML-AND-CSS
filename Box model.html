<!DOCTYPE html>
<head>

 <style>
 .main{

 }
 .box{

 }
 .box1{

 color:rgb(255, 255, 255);

 }

 }
 </style>
</head>

<div class = "main">CSS Box-Model Property</div>
 <div class = "box">

 <div class = "box2">Demonstration of CSS Box Model</div>
 </div>
 </body>
</html>
